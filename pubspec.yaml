name: edutrack_family
description: "EduTrack Family - Plataforma de gestión de tareas escolares para padres, tutores y profesores."
publish_to: 'none'

version: 2.0.0+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─────────────────────────────────────────
  # UI & ICONOS
  # ─────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17            # Iconos SVG personalizados
  google_fonts: ^6.2.1            # Tipografías modernas (Poppins, Nunito, etc.)
  shimmer: ^3.0.0                 # Efecto de carga animado
  lottie: ^3.3.1                  # Animaciones Lottie (splash, empty states)
  cached_network_image: ^3.4.1    # Imágenes cacheadas para evidencias remotas
  badges: ^3.1.2                  # Badges/contadores en íconos (tareas pendientes)
  flutter_animate: ^4.5.2         # Animaciones declarativas simples

  # ─────────────────────────────────────────
  # NAVEGACIÓN
  # ─────────────────────────────────────────
  go_router: ^14.8.1              # Navegación declarativa moderna con rutas nombradas

  # ─────────────────────────────────────────
  # ESTADO (STATE MANAGEMENT)
  # ─────────────────────────────────────────
  flutter_riverpod: ^2.6.1        # Gestión de estado reactiva (reemplazo moderno de Provider)
  riverpod_annotation: ^2.6.1     # Anotaciones para generación de código con Riverpod

  # ─────────────────────────────────────────
  # BASE DE DATOS LOCAL (SQLITE)
  # ─────────────────────────────────────────
  sqflite: ^2.4.2                 # Base de datos SQLite local (Android + iOS)
  path: ^1.9.1                    # Utilidades para rutas de archivos
  path_provider: ^2.1.5           # Rutas del sistema de archivos del dispositivo

  # ─────────────────────────────────────────
  # ALMACENAMIENTO LIGERO
  # ─────────────────────────────────────────
  shared_preferences: ^2.5.3      # Guardar sesión activa, preferencias, configuración

  # ─────────────────────────────────────────
  # FIREBASE (AUTH REAL + SYNC + STORAGE + PUSH)
  # ─────────────────────────────────────────
  firebase_core: ^4.11.0          # Core de Firebase (requerido por todos los plugins Firebase)
  firebase_auth: ^6.5.4           # Auth real: email/password + Google + custom tokens
  cloud_firestore: ^6.6.0         # Base de datos en la nube en tiempo real (sync)
  firebase_storage: ^13.0.4       # Almacenamiento de fotos de evidencia en la nube
  firebase_messaging: ^16.4.1     # Push FCM (sobrevive al cierre de la app)
  cloud_functions: ^6.0.4         # Callables: registerRole, createLinkCode, redeemLinkCode
  google_sign_in: ^7.2.0          # Inicio de sesión con Google (API v7)

  # ─────────────────────────────────────────
  # SEGURIDAD Y UBICACIÓN
  # ─────────────────────────────────────────
  local_auth: ^3.0.1              # Huella dactilar / Face ID (gate biométrico)
  geolocator: ^14.0.3             # GPS del estudiante
  flutter_foreground_task: ^9.2.2 # Servicio foreground Android (tracking fiable ante Doze)
  flutter_map: ^8.3.1             # Mapa OpenStreetMap (gratis, sin API key)
  latlong2: ^0.9.1                # Coordenadas para flutter_map

  # ─────────────────────────────────────────
  # NOTIFICACIONES LOCALES (ALARMAS + VIBRACIÓN + SONIDO)
  # ─────────────────────────────────────────
  flutter_local_notifications: ^21.0.0  # Notificaciones locales programadas
  timezone: 0.11.0               # Manejo de zonas horarias para notificaciones (America/Panama)
  awesome_notifications: ^0.10.1  # Notificaciones avanzadas con vibración y sonido custom

  # ─────────────────────────────────────────
  # CÁMARA Y ARCHIVOS (FOTOS DE EVIDENCIA)
  # ─────────────────────────────────────────
  image_picker: ^1.1.2            # Tomar foto o elegir de galería
  image_cropper: ^9.1.0           # Recortar imagen antes de guardar

  # ─────────────────────────────────────────
  # PERMISOS DEL DISPOSITIVO
  # ─────────────────────────────────────────
  permission_handler: ^12.0.1     # Solicitar permisos: cámara, notificaciones, almacenamiento

  # ─────────────────────────────────────────
  # CONECTIVIDAD (DETECCIÓN DE WIFI)
  # ─────────────────────────────────────────
  connectivity_plus: ^6.1.4       # Detectar si hay WiFi para activar sincronización

  # ─────────────────────────────────────────
  # CALENDARIO
  # ─────────────────────────────────────────
  table_calendar: ^3.2.0          # Widget de calendario interactivo (mes, semana, día)

  # ─────────────────────────────────────────
  # FECHA Y HORA
  # ─────────────────────────────────────────
  intl: ^0.20.2                   # Formateo de fechas y localización en español
  flutter_datetime_picker_plus: ^2.2.0  # Selector de fecha y hora con UI moderna

  # ─────────────────────────────────────────
  # UTILIDADES
  # ─────────────────────────────────────────
  uuid: ^4.5.1                    # Generar IDs únicos para tareas/eventos
  equatable: ^2.0.7               # Comparación de objetos para modelos
  collection: ^1.19.1             # Utilidades para listas y mapas (groupBy, sorted, etc.)
  flutter_slidable: ^3.1.2        # Deslizar para eliminar/editar items de lista
  flutter_image_compress: ^2.4.0
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0           # Reglas de análisis estático recomendadas
  riverpod_generator: ^2.6.2      # Generador de código para @riverpod annotations
  build_runner: ^2.4.15           # Runner de generación de código (riverpod_generator)
  flutter_launcher_icons: ^0.14.3 # Generar ícono de la app para Android e iOS
  flutter_native_splash: ^2.4.3   # Pantalla de splash nativa automática

# ─────────────────────────────────────────
# CONFIGURACIÓN DE ÍCONO DE LA APP
# ─────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1A3C5E"   # Azul marino (fondo del ícono adaptativo Android)
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false

# ─────────────────────────────────────────
# CONFIGURACIÓN DE SPLASH SCREEN
# ─────────────────────────────────────────
flutter_native_splash:
  color: "#1A3C5E"                # Azul marino
  image: assets/images/logo.png
  android: true
  ios: true
  android_12:
    image: assets/images/logo.png
    color: "#1A3C5E"

# ─────────────────────────────────────────
# FLUTTER ASSETS & FUENTES
# ─────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    # Imágenes generales
    - assets/images/
    # Íconos de la app
    - assets/icons/
    # Sonidos para notificaciones
    - assets/sounds/
    # Animaciones Lottie (JSON)
    - assets/animations/

  fonts:
    # Poppins - fuente principal UI
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    # Nunito - fuente secundaria (fuente variable, todos los pesos en un archivo)
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700