<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduTrack Family — Todas las versiones</title>
<meta name="description" content="Historial completo de versiones de EduTrack Family, con descargas por versión.">
<style>
  :root {
    --navy: #0F2744;
    --navy-2: #16406e;
    --blue: #2196F3;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --text: #1A2530;
    --muted: #5B6B7A;
    --border: #E3E8EE;
    --tag-bg: #E3F2FD;
    --tag-text: #1565C0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1220; --card: #151E2E; --text: #E8EDF3; --muted: #93A2B5;
      --border: #24324A; --tag-bg: #12314F; --tag-text: #7CC0FF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1220; --card: #151E2E; --text: #E8EDF3; --muted: #93A2B5;
    --border: #24324A; --tag-bg: #12314F; --tag-text: #7CC0FF;
  }
  :root[data-theme="light"] {
    --bg: #F4F6F9; --card: #FFFFFF; --text: #1A2530; --muted: #5B6B7A;
    --border: #E3E8EE; --tag-bg: #E3F2FD; --tag-text: #1565C0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  a { color: var(--blue); }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--navy);
    color: #fff;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .topbar nav a { color: #cfe0f5; text-decoration: none; font-size: 14px; margin-left: 18px; }
  .topbar nav a:hover { color: #fff; }
  .theme-toggle {
    margin-left: 18px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    border-radius: 999px;
    width: 34px; height: 34px;
    cursor: pointer;
    font-size: 15px;
  }
  .theme-toggle:hover { background: rgba(255,255,255,0.22); }

  header.page-head {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 40px 24px 48px;
    text-align: center;
  }
  header.page-head h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
  header.page-head p { margin: 0; opacity: 0.85; }

  main { max-width: 760px; margin: -24px auto 0; padding: 0 20px 40px; }

  .release {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 18px;
  }
  .release .meta {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .release .ver { font-weight: 800; font-size: 18px; }
  .release .date { font-size: 13px; color: var(--muted); }
  .tag {
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; background: var(--tag-bg); color: var(--tag-text);
  }
  .release .body {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 14px;
  }
  .release .body ul { margin: 0; padding-left: 20px; }
  .assets { display: flex; flex-wrap: wrap; gap: 10px; }
  .asset-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .asset-btn:hover { border-color: var(--blue); color: var(--blue); }
  .asset-btn .size { color: var(--muted); font-weight: 400; }

  .loading, .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }

  footer {
    background: var(--navy);
    color: #b9c8db;
    text-align: center;
    padding: 24px 20px;
    font-size: 13px;
  }
  footer a { color: #cfe0f5; text-decoration: none; margin: 0 8px; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">🎓 EduTrack Family</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="index.html#descargas">Última versión</a>
      <a href="https://github.com/Litdemonick/edutrack-family">GitHub</a>
      <button class="theme-toggle" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">🌙</button>
    </nav>
  </div>

  <header class="page-head">
    <h1>Todas las versiones</h1>
    <p>Historial completo — elige cuál instalar.</p>
  </header>

  <main>
    <div id="releaseList" class="loading">Cargando versiones…</div>
  </main>

  <footer>
    <a href="index.html">Inicio</a>
    <a href="https://github.com/Litdemonick/edutrack-family/releases">Ver en GitHub</a>
  </footer>

  <script>
    (function () {
      const root = document.documentElement;
      const btn = document.getElementById('themeToggle');
      const saved = localStorage.getItem('theme');
      if (saved) root.setAttribute('data-theme', saved);
      function current() {
        return root.getAttribute('data-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      function updateIcon() { btn.textContent = current() === 'dark' ? '☀️' : '🌙'; }
      updateIcon();
      btn.addEventListener('click', () => {
        const next = current() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
      });
    })();

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Convierte el cuerpo de la nota de release (markdown simple, líneas
    // "- item") a HTML básico — suficiente para nuestras notas, sin
    // necesidad de una librería de markdown completa.
    function renderBody(md) {
      if (!md) return '';
      const lines = md.split('\n');
      let html = '';
      let inList = false;
      for (const raw of lines) {
        const line = raw.trim();
        if (line.startsWith('- ') || line.startsWith('* ')) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += '<li>' + escapeHtml(line.slice(2)) + '</li>';
        } else {
          if (inList) { html += '</ul>'; inList = false; }
          if (line) html += '<p>' + escapeHtml(line) + '</p>';
        }
      }
      if (inList) html += '</ul>';
      return html;
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('es-PA', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function fmtSize(bytes) {
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function assetEmoji(name) {
      const n = name.toLowerCase();
      if (n.endsWith('.apk')) return '🤖';
      if (n.endsWith('.exe')) return '🪟';
      if (n.endsWith('.deb') || n.endsWith('.appimage')) return '🐧';
      if (n.endsWith('.dmg') || n.endsWith('.ipa')) return '🍎';
      return '📦';
    }

    fetch('https://api.github.com/repos/Litdemonick/edutrack-family/releases')
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((releases) => {
        const list = document.getElementById('releaseList');
        if (!releases || releases.length === 0) {
          list.className = 'empty';
          list.textContent = 'Todavía no hay releases publicadas.';
          return;
        }
        list.className = '';
        list.innerHTML = releases.map((rel, i) => `
          <div class="release">
            <div class="meta">
              <span class="ver">${escapeHtml(rel.tag_name || rel.name || '')}</span>
              ${i === 0 ? '<span class="tag">Más reciente</span>' : ''}
              <span class="date">${fmtDate(rel.published_at || rel.created_at)}</span>
            </div>
            <div class="body">${renderBody(rel.body) || '<p>Sin notas.</p>'}</div>
            <div class="assets">
              ${(rel.assets || []).map((a) => `
                <a class="asset-btn" href="${a.browser_download_url}">
                  ${assetEmoji(a.name)} ${escapeHtml(a.name)}
                  <span class="size">${fmtSize(a.size)}</span>
                </a>
              `).join('')}
            </div>
          </div>
        `).join('');
      })
      .catch(() => {
        const list = document.getElementById('releaseList');
        list.className = 'empty';
        list.innerHTML = 'No se pudo cargar el historial ahora mismo — probá de nuevo en un momento, o mirá <a href="https://github.com/Litdemonick/edutrack-family/releases">las releases directo en GitHub</a>.';
      });
  </script>
</body>
</html>
